services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: siagasos
      POSTGRES_PASSWORD: siagasos_local
      POSTGRES_DB: postgres
    ports: ["5455:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/01-app-role.sql:ro
  redis:
    image: redis:7
    ports: ["6380:6379"]
volumes:
  pgdata:

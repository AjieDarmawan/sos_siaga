<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* Pasang tema sebelum render pertama supaya tidak berkedip (lihat src/lib/theme.ts). */
      (function () {
        var d = document.documentElement, dark = matchMedia('(prefers-color-scheme: dark)').matches, p = {};
        try { p = JSON.parse(localStorage.getItem('siagasos.theme') || '{}'); } catch (e) {}
        var m = p.mode || 'system';
        d.dataset.theme = m === 'dark' || (m === 'system' && dark) ? 'dark' : 'light';
        if (p.accent && p.accent !== 'slate') d.dataset.accent = p.accent;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>SiagaSOS — Tombol darurat siap pakai untuk aplikasi Anda</title>
    <meta name="description" content="SiagaSOS: infrastruktur tombol SOS untuk aplikasi perusahaan di Indonesia. Pasang SDK, laporan darurat masuk realtime ke dashboard tim keamanan lengkap dengan lokasi live." />
    <meta property="og:title" content="SiagaSOS — Tombol darurat siap pakai untuk aplikasi Anda" />
    <meta property="og:description" content="Pasang SDK dalam hitungan menit. Laporan SOS masuk realtime ke dashboard tim Anda, lengkap dengan lokasi live." />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>

  </body>
</html>

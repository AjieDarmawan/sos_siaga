<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* Pasang tema sebelum render pertama supaya tidak berkedip (lihat src/lib/theme.ts). */
      (function () {
        var d = document.documentElement, dark = matchMedia('(prefers-color-scheme: dark)').matches, p = {};
        try { p = JSON.parse(localStorage.getItem('siagasos.theme') || '{}'); } catch (e) {}
        var m = p.mode || 'system';
        d.dataset.theme = m === 'dark' || (m === 'system' && dark) ? 'dark' : 'light';
        if (p.accent && p.accent !== 'slate') d.dataset.accent = p.accent;
      })();
    </script>
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>SiagaSOS Admin</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f172a'/%3E%3Cpath d='M16 7v10M16 22v3' stroke='%23f87171' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

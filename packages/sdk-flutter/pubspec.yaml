name: siagasos
description: SiagaSOS SDK untuk Flutter — tombol darurat (SOS) dengan antrian offline, status realtime, lokasi live, dan lampiran foto/video/suara.
version: 0.1.0
homepage: https://siagasos.id
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ">=1.2.0 <2.0.0"
  shared_preferences: ">=2.2.0 <3.0.0"

flutter:
  assets:
    - assets/police.png

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
